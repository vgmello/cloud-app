# Harness for the control-side composite action (Phase 1).
#
# Stands in for .github/workflows/bootstrap.yml, driven directly rather than
# through a dispatch: the caller-side scenarios already cover the dispatch
# boundary via the fake GitHub API, and running act inside act to join the two
# halves would add docker-in-docker for no extra coverage.
#
# Knobs arrive as E2E_* environment variables for the same reason as
# deploy.yml -- see the note there.
name: e2e-bootstrap

on: [push, workflow_dispatch]

permissions:
  contents: write
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Put the fake cloud ahead of az/terraform/docker
        shell: bash
        run: echo "$GITHUB_WORKSPACE/tests/e2e/fakecloud/bin" >> "$GITHUB_PATH"

      - name: Bootstrap
        id: bootstrap
        uses: ./.github/actions/deploy-stack
        with:
          caller-repo: ${{ env.E2E_CALLER_REPO || 'orders-app' }}
          stack-name: ${{ env.E2E_STACK_NAME || 'orders-api' }}
          stack-file: ${{ env.E2E_STACK_FILE || 'cloud-app.yml' }}
          environment: ${{ env.E2E_ENVIRONMENT || 'dev' }}
          plan-only: ${{ env.E2E_PLAN_ONLY || 'false' }}
          github-token: e2e-fake-caller-token

      - name: Record step outcome
        if: always()
        shell: bash
        env:
          OUT_OUTCOME: ${{ steps.bootstrap.outcome }}
        run: |
          mkdir -p "$FAKECLOUD_STATE"
          jq -n --arg outcome "$OUT_OUTCOME" '{outcome: $outcome}' \
            > "$FAKECLOUD_STATE/action-outputs.json"
