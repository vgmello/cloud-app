name: upload-artifact (e2e stub)
description: >-
  Stands in for actions/upload-artifact. act's own artifact server speaks a
  protocol that varies by act version; copying into the state directory is
  stable and gives pytest the files directly.
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: File or directory to upload
    required: true
  retention-days:
    description: unused
    required: false
  if-no-files-found:
    description: unused
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        ARTIFACT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        DEST="$FAKECLOUD_STATE/artifacts/$ARTIFACT_NAME"
        mkdir -p "$DEST"
        if [ -d "$ARTIFACT_PATH" ]; then
          cp -R "$ARTIFACT_PATH"/. "$DEST"/
        elif [ -e "$ARTIFACT_PATH" ]; then
          cp "$ARTIFACT_PATH" "$DEST"/
        else
          echo "::warning::e2e upload-artifact: nothing at '$ARTIFACT_PATH'"
        fi
        echo "e2e artifact '$ARTIFACT_NAME' -> $DEST"
