# Variant exercising the manifest's deploy: block, including a per-environment
# override -- the thing these knobs could not express while they were workflow
# inputs.
name: orders-api

apps:
  api:
    port: 8080
    ingress: internal
    docker:
      file: ./Dockerfile
      context: .

deploy:
  verify: true
  verify_timeout: 300

environments:
  dev:
    deploy:
      verify: false
      verify_timeout: 5
  prod: {}
