name: shop

apps:
  api:
    port: 8080
    ingress: internal
    databases: [primary/orders, reporting/main]
  worker:
    ingress: none
    databases: [primary/orders, primary/billing]

functions:
  sync:
    image: myacr.azurecr.io/sync:1.0
    databases: [reporting/main]

databases:
  primary:
    type: postgres
    size: small
    dbs: [orders, billing]
  reporting:
    type: sqlserver
    size: large

environments:
  dev: {}
  prod:
    databases:
      primary:
        size: medium
