name: 'deploy-stack'
description: 'Phase 1 (control repo): authorize a caller against the stack-lock registry, then run the bootstrap stack under the bootstrap identity — creating the resource group and the plan/apply identities federated to the caller. Outputs the RG + identity client-ids for the caller to run the resource deploy.'

inputs:
  caller-repo:
    description: 'Caller repository name (under the same owner as this repo)'
    required: true
  stack-file:
    description: 'Manifest path within the caller repo'
    required: false
    default: '.cloud-app.yml'
  stack-name:
    description: 'Stack name (state key prefix); must match the manifest name'
    required: true
  caller-branch:
    description: 'Ref of the caller repo'
    required: false
    default: 'main'
  environment:
    description: 'Target environment'
    required: false
    default: 'dev'
  github-token:
    description: 'Token scoped to the caller repo (used to check it out)'
    required: true
  plan-only:
    description: 'Plan the bootstrap stack without applying'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Central repo (this repo): holds cloudapp, terraform, environments, and the
    # lock registry. Checked out with the default token so the lock push in the
    # gate can write back to main.
    - name: Checkout central repo
      uses: actions/checkout@v4
      with:
        path: central-workspace

    # Caller repo: holds the stack manifest. Read with the caller-scoped token.
    - name: Checkout caller repo
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.caller-repo }}
        ref: ${{ inputs.caller-branch }}
        token: ${{ inputs.github-token }}
        path: caller-workspace

    - name: Install cloudapp dependencies
      shell: bash
      run: python3 -m pip install --user -q -r central-workspace/engine/requirements.txt

    # Authorization gate: verifies the manifest name matches stack-name and that
    # this caller owns the stack in the registry (trust-on-first-use).
    - name: Validate stack ownership
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
        STACK_FILE: ${{ inputs.stack-file }}
        EXPECTED_STACK_NAME: ${{ inputs.stack-name }}
        CALLER_REPO: ${{ github.repository_owner }}/${{ inputs.caller-repo }}
      run: python3 central-workspace/.github/scripts/validate_and_lock.py

    # Parse validates the manifest and produces tool.<env>.json (terraform-deploy
    # requires a --tool-json even for the bootstrap stack).
    - name: Parse manifest
      shell: bash
      env:
        PYTHONPATH: central-workspace/engine
      run: >-
        python3 -m cloudapp parse-manifest
        --manifest "caller-workspace/${{ inputs.stack-file }}"
        --output-dir .cloud-app
        --app-root caller-workspace

    - name: Read bootstrap identity
      id: bootstrap-id
      shell: bash
      run: |
        FILE="central-workspace/environments/${{ inputs.environment }}.yml"
        {
          echo "client_id=$(yq '.bootstrap_identity_client_id' "$FILE")"
          echo "tenant_id=$(yq '.tenant_id' "$FILE")"
          echo "subscription_id=$(yq '.subscription_id' "$FILE")"
        } >> "$GITHUB_OUTPUT"

    - name: Azure login (bootstrap identity)
      uses: azure/login@v2
      with:
        client-id: ${{ steps.bootstrap-id.outputs.client_id }}
        tenant-id: ${{ steps.bootstrap-id.outputs.tenant_id }}
        subscription-id: ${{ steps.bootstrap-id.outputs.subscription_id }}

    # Bootstrap tfvars: name, env, subscription, location, and the plan/apply
    # OIDC subjects federated to the CALLER repo (delegated mode).
    - name: Build bootstrap tfvars
      shell: bash
      env:
        PYTHONPATH: central-workspace/engine
      run: >-
        python3 -m cloudapp bootstrap-vars
        --name "${{ inputs.stack-name }}"
        --environment "${{ inputs.environment }}"
        --mode delegated
        --app-repo "${{ github.repository_owner }}/${{ inputs.caller-repo }}"
        --central-repo "${{ github.repository }}"
        --platform-file "central-workspace/environments/${{ inputs.environment }}.yml"
        > bootstrap-tfvars.json

    - name: Terraform bootstrap
      id: deploy
      shell: bash
      env:
        PYTHONPATH: central-workspace/engine
      run: >-
        python3 -m cloudapp terraform-deploy
        --stack bootstrap
        --terraform-dir central-workspace/terraform/azure/bootstrap
        --tfvars-file bootstrap-tfvars.json
        --tool-json ".cloud-app/tool.${{ inputs.environment }}.json"
        --tool-name "${{ inputs.stack-name }}"
        --environment "${{ inputs.environment }}"
        --platform-file "central-workspace/environments/${{ inputs.environment }}.yml"
        ${{ inputs.plan-only == 'true' && '--plan-only' || '' }}

    # Capture the bootstrap results (RG + plan/apply identity client-ids) so the
    # caller can run the resource deploy under those identities. Runs even on
    # failure so the caller always gets a status.
    - name: Collect bootstrap outputs
      if: always()
      shell: bash
      env:
        STACK_NAME: ${{ inputs.stack-name }}
        TARGET_ENV: ${{ inputs.environment }}
        DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
      run: |
        mkdir -p outputs
        TF_DIR=central-workspace/terraform/azure/bootstrap

        if [ -f "$TF_DIR/tfplan" ]; then
          terraform -chdir="$TF_DIR" show -no-color tfplan > outputs/tf-plan.txt 2>/dev/null || true
        fi

        terraform -chdir="$TF_DIR" output -json > outputs/tf-outputs.json 2>/dev/null \
          || echo '{}' > outputs/tf-outputs.json

        RG=$(jq -r '.resource_group_name.value // ""' outputs/tf-outputs.json 2>/dev/null || echo "")
        PLAN_ID=$(jq -r '.plan_identity_client_id.value // ""' outputs/tf-outputs.json 2>/dev/null || echo "")
        APPLY_ID=$(jq -r '.apply_identity_client_id.value // ""' outputs/tf-outputs.json 2>/dev/null || echo "")

        jq -n \
          --arg stack "$STACK_NAME" \
          --arg env "$TARGET_ENV" \
          --arg rg "$RG" \
          --arg plan "$PLAN_ID" \
          --arg apply "$APPLY_ID" \
          --arg at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          --arg status "${DEPLOY_OUTCOME:-unknown}" \
          '{stack_name: $stack, environment: $env, resource_group: $rg, plan_client_id: $plan, apply_client_id: $apply, deployed_at: $at, status: $status}' \
          > outputs/deployment-results.json

        echo "### Bootstrap: $STACK_NAME ($TARGET_ENV) — ${DEPLOY_OUTCOME:-unknown}" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload bootstrap outputs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-outputs-${{ github.run_id }}
        path: outputs/
        retention-days: 1
