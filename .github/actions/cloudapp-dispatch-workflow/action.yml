name: 'cloudapp-dispatch-workflow'
description: 'Low-level primitive: generate a GitHub App token, dispatch a target workflow, and poll it to completion. Used internally by the cloud-app.yml reusable workflow bootstrap job.'

inputs:
  app-id:
    description: 'GitHub App ID'
    required: true
  app-private-key:
    description: 'GitHub App Private Key (.pem contents)'
    required: true

  repo:
    description: 'Caller repository name (Defaults to the current repository name)'
    required: false
    default: ''
  stack-file:
    description: 'Stack manifest path passed through to the target workflow'
    required: false
    default: '.cloud-app.yml'
  stack-name:
    description: 'Stack name passed to the target workflow (the deploy identity/lock key)'
    required: true
  branch:
    description: 'Caller branch to deploy'
    required: false
    default: 'main'
  env:
    description: 'Target deployment environment'
    required: false
    default: 'dev'

  # Target Repository Defaults
  target-owner:
    description: 'Target Owner/Org (Defaults to current repository owner)'
    required: false
    default: ''
  target-repo:
    description: 'Target Repository Name (Defaults to "cloud-app")'
    required: false
    default: 'cloud-app'
  target-workflow:
    description: 'Target Workflow Filename (Defaults to "bootstrap.yml")'
    required: false
    default: 'bootstrap.yml'
  target-branch:
    description: 'Branch of target-repo to execute workflow from'
    required: false
    default: 'main'

outputs:
  status:
    description: 'Outcome of the target run'
    value: ${{ steps.dispatch.outputs.status }}
  deployed_at:
    description: 'UTC timestamp of the target run'
    value: ${{ steps.dispatch.outputs.deployed_at }}
  stack_name:
    description: 'Stack name'
    value: ${{ steps.dispatch.outputs.stack_name }}
  environment:
    description: 'Target environment'
    value: ${{ steps.dispatch.outputs.environment }}
  # Bootstrap outputs (Phase 1): the RG and the RG-scoped identity client-ids the
  # caller uses to run the resource deploy.
  resource_group:
    description: 'Resource group created by the bootstrap'
    value: ${{ steps.dispatch.outputs.resource_group }}
  plan_client_id:
    description: 'Client id of the plan identity (Reader)'
    value: ${{ steps.dispatch.outputs.plan_client_id }}
  apply_client_id:
    description: 'Client id of the apply identity (Contributor)'
    value: ${{ steps.dispatch.outputs.apply_client_id }}

runs:
  using: 'composite'
  steps:
    - name: Prepare Action Inputs & Defaults
      id: prepare-inputs
      shell: bash
      run: |
        # 1. Resolve Owner (Defaults to caller repository owner)
        OWNER="${{ inputs.target-owner }}"
        if [ -z "$OWNER" ]; then
          OWNER="${{ github.repository_owner }}"
        fi
        echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

        # 2. Resolve Repo input (Defaults to caller repository name)
        CALLER_REPO="${{ inputs.repo }}"
        if [ -z "$CALLER_REPO" ]; then
          CALLER_REPO="${{ github.event.repository.name }}"
        fi
        echo "caller_repo=$CALLER_REPO" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App Token
      id: generate-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.prepare-inputs.outputs.owner }}
        repositories: ${{ inputs.target-repo }}

    - name: Trigger and Poll Target Workflow
      id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        TARGET_OWNER: ${{ steps.prepare-inputs.outputs.owner }}
        TARGET_REPO: ${{ inputs.target-repo }}
        TARGET_WORKFLOW: ${{ inputs.target-workflow }}
        TARGET_BRANCH: ${{ inputs.target-branch }}

        # Dispatch Inputs (Mapped automatically by dispatch_and_wait.py)
        INPUT_REPO: ${{ steps.prepare-inputs.outputs.caller_repo }}
        INPUT_MANIFEST: ${{ inputs.stack-file }}
        INPUT_STACK_NAME: ${{ inputs.stack-name }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_ENV: ${{ inputs.env }}
      run: python ${{ github.action_path }}/../../scripts/dispatch_and_wait.py

    - name: Post Summary to Caller Workflow
      if: always()
      shell: bash
      run: |
        cat <<EOF >> "$GITHUB_STEP_SUMMARY"
        ### Target Deployment Summary
        - **Target Repository:** \`${{ inputs.target-repo }}\`
        - **Stack Name:** \`${{ inputs.stack-name }}\`
        - **Environment:** \`${{ inputs.env }}\`
        - **Caller Branch:** \`${{ inputs.branch }}\`
        - **[View Target Workflow Execution Logs](${{ env.TARGET_RUN_URL }})**
        EOF
