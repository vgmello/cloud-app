name: cloud-app
description: >-
  Deploy one environment of a cloud-app stack. Dispatches the control repo's
  bootstrap (Phase 1: RG + plan/apply identities federated to this repo), then
  runs the resource deploy under those RG-scoped identities (Phase 2). Invoke
  as a step in a job that sets `environment:` — the OIDC subject the RG-scoped
  identities trust. Prerequisite: the caller repo must already be checked out
  in the workspace (add `uses: actions/checkout` as a prior step); this action
  reads the manifest and Dockerfile/context from it and does not check out for
  you.
inputs:
  env:
    description: Target environment to deploy (must be declared in the manifest)
    required: true
  manifest:
    description: Path to the cloud-app manifest in the caller repo
    default: cloud-app.yml
  plan_only:
    description: Plan without applying
    default: "false"
  app-id:
    description: GitHub App id used to dispatch the control repo bootstrap
    required: true
  app-private-key:
    description: GitHub App private key (.pem contents)
    required: true
  app-secrets:
    description: >-
      Newline-delimited NAME=value app secrets to sync to Key Vault. Enumerate
      exactly the names your manifest `secrets:` list declares. Single-line
      values only.
    default: ""
  control-repo:
    description: Control repo name that holds bootstrap.yml
    default: cloud-app
  control-ref:
    description: Ref of the control repo to run bootstrap.yml from
    default: main
  always_run_terraform:
    description: >-
      Force Terraform (plan + apply) to run on every invocation. When false
      (default), Terraform runs only when the manifest changed since the
      previous commit; on an unchanged manifest the whole Terraform run is
      skipped and the image is rebuilt and rotated directly onto the existing
      container apps/functions — a code/Docker change alone does not trigger
      Terraform. The
      default (false) requires the caller to check out with `fetch-depth: 2` so
      the previous commit is available to diff; Terraform also always runs for
      plan-only runs, manual dispatch, first deploys, and when the parent commit
      is unavailable.
      NOTE: the change signal is the caller's manifest only. A platform-config
      change (control repo `environments/<env>.yml` — DNS, network, naming) is
      NOT detected here; roll those out with a manual dispatch or with
      always_run_terraform: true.
    default: "false"
outputs:
  name:
    description: Resolved stack name (manifest name)
    value: ${{ steps.parse.outputs.name }}
  code_functions:
    description: Whether any environment declares a code (runtime) function
    value: ${{ steps.parse.outputs.code_functions }}
  manifest_changed:
    description: Whether the manifest changed since the previous commit (true if it could not be determined)
    value: ${{ steps.detect.outputs.manifest_changed }}
  applied:
    description: Whether the Terraform apply/plan step ran (false when the Terraform run was skipped)
    value: ${{ steps.gate.outputs.should_apply }}
  resource_group:
    description: Resource group created by the bootstrap
    value: ${{ steps.bootstrap.outputs.resource_group }}
  summary:
    description: One-line terraform plan/apply summary
    value: ${{ steps.deploy.outputs.summary }}
runs:
  using: composite
  steps:
    # Precondition: this action operates on an already-checked-out workspace and
    # never checks out for the caller (that would clobber their workspace and
    # steal ref/token/checkout-option control). Fail fast with an actionable
    # message if the manifest is absent — the usual cause is a missing checkout.
    - name: Require caller checkout
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: |
        if [ ! -f "$MANIFEST" ]; then
          echo "::error::cloud-app: manifest '$MANIFEST' not found in the workspace. Check out the caller repo before this action — add a step 'uses: actions/checkout@v4' ahead of it (and set the 'manifest:' input if your manifest is not at the repo root)."
          exit 1
        fi

    # Pure git signal: did the manifest change since the previous commit? Used by
    # always_run_terraform (default false). "true" whenever it cannot be proven unchanged (new file, no
    # parent commit / shallow checkout) so the apply is never skipped on doubt.
    # Needs the caller to check out with fetch-depth >= 2.
    - name: Detect manifest change
      id: detect
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: |
        changed=true
        if ! git rev-parse --verify -q HEAD^ >/dev/null 2>&1; then
          reason="no parent commit available (shallow checkout? set fetch-depth: 2)"
        elif ! git cat-file -e "HEAD^:$MANIFEST" 2>/dev/null; then
          reason="manifest is new in this commit"
        elif git diff --quiet HEAD^ HEAD -- "$MANIFEST"; then
          changed=false
          reason="manifest unchanged since previous commit"
        else
          reason="manifest changed since previous commit"
        fi
        echo "manifest_changed=$changed" >> "$GITHUB_OUTPUT"
        echo "cloud-app: manifest_changed=$changed ($reason)"

    - name: Install engine deps
      shell: bash
      run: pip install -q -r "${{ github.action_path }}/../../../engine/requirements.txt"

    - name: Parse manifest
      id: parse
      shell: bash
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp parse-manifest
        --manifest "${{ inputs.manifest }}"
        --output-dir .cloud-app
        --app-root "."

    - name: Validate target environment is declared
      shell: bash
      env:
        ENVIRONMENTS: ${{ steps.parse.outputs.environments }}
        ENV: ${{ inputs.env }}
      run: |
        if ! echo "$ENVIRONMENTS" | jq -e --arg e "$ENV" 'index($e)' > /dev/null; then
          echo "::error::environment '$ENV' is not declared in the manifest ($(echo "$ENVIRONMENTS" | jq -r 'join(", ")'))"
          exit 1
        fi

    - name: Generate control-repo App token
      id: token
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.control-repo }}

    - name: Bootstrap dispatch (Phase 1)
      id: bootstrap
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        TARGET_OWNER: ${{ github.repository_owner }}
        TARGET_REPO: ${{ inputs.control-repo }}
        TARGET_WORKFLOW: bootstrap.yml
        TARGET_BRANCH: ${{ inputs.control-ref }}
        INPUT_REPO: ${{ github.event.repository.name }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_STACK_NAME: ${{ steps.parse.outputs.name }}
        INPUT_BRANCH: ${{ github.ref_name }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_PLAN_ONLY: ${{ inputs.plan_only }}
      run: python "${{ github.action_path }}/../../scripts/dispatch_and_wait.py"

    - name: Bootstrap dispatch summary
      if: always()
      shell: bash
      run: |
        cat <<EOF >> "$GITHUB_STEP_SUMMARY"
        ### Bootstrap Dispatch Summary
        - **Control Repository:** \`${{ inputs.control-repo }}\`
        - **Stack Name:** \`${{ steps.parse.outputs.name }}\`
        - **Environment:** \`${{ inputs.env }}\`
        - **Caller Branch:** \`${{ github.ref_name }}\`
        - **[View Control Bootstrap Run](${{ env.TARGET_RUN_URL }})**
        EOF

    - name: Read platform config
      id: platform
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
        TOOL_NAME: ${{ steps.parse.outputs.name }}
      run: |
        FILE="${{ github.action_path }}/../../../environments/$DEPLOY_ENV.yml"
        if [ ! -f "$FILE" ]; then
          echo "::error::no platform config for environment '$DEPLOY_ENV' ($FILE missing)"
          exit 1
        fi
        {
          echo "file=$FILE"
          echo "registry=$(yq '.acr.login_server' "$FILE")"
          echo "client_id=$(yq '.deploy.client_id' "$FILE")"
          echo "tenant_id=$(yq '.tenant_id' "$FILE")"
          echo "subscription_id=$(yq '.subscription_id' "$FILE")"
          PREFIX=$(yq '.naming_prefix // ""' "$FILE")
          KV=$(python3 -c "import sys; n = ('kv-' + sys.argv[1] + sys.argv[2] + '-' + sys.argv[3])[:24]; print(n[:-1] if n.endswith('-') else n)" "$PREFIX" "$TOOL_NAME" "$DEPLOY_ENV")
          echo "keyvault=$KV"
        } >> "$GITHUB_OUTPUT"

    # Build: push under the apply identity (repo-scoped ACR push). Skipped for
    # non-docker stacks and plan-only runs.
    - name: Azure login (build, apply identity)
      if: ${{ steps.parse.outputs.docker == 'true' && inputs.plan_only == 'false' }}
      uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
      with:
        client-id: ${{ steps.bootstrap.outputs.apply_client_id }}
        tenant-id: ${{ steps.platform.outputs.tenant_id }}
        subscription-id: ${{ steps.platform.outputs.subscription_id }}

    - name: Build and push image
      id: build
      if: ${{ steps.parse.outputs.docker == 'true' && inputs.plan_only == 'false' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp docker-build
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --tool-name "${{ steps.parse.outputs.name }}"
        --registry "${{ steps.platform.outputs.registry }}"
        --git-sha "${{ github.sha }}"

    # Deploy: log in as the RG-scoped identity bootstrap federated to this repo —
    # plan (Reader) for plan-only, apply (Contributor) otherwise.
    - name: Azure login (deploy)
      uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
      with:
        client-id: ${{ inputs.plan_only == 'true' && steps.bootstrap.outputs.plan_client_id || steps.bootstrap.outputs.apply_client_id }}
        tenant-id: ${{ steps.platform.outputs.tenant_id }}
        subscription-id: ${{ steps.platform.outputs.subscription_id }}

    # First-deploy signal for always_run_terraform: does the Terraform state blob already
    # exist? Authoritative (unlike a manifest diff) and cheap (one az call under
    # the deploy identity, no terraform init). Only meaningful on the apply path.
    - name: Check first deploy
      id: state
      if: ${{ inputs.plan_only == 'false' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp state-exists
        --platform-file "${{ steps.platform.outputs.file }}"
        --tool-name "${{ steps.parse.outputs.name }}"
        --environment "$DEPLOY_ENV"

    - name: Resolve config
      id: resolve
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp resolve-config
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --platform-file "${{ steps.platform.outputs.file }}"
        --environment "$DEPLOY_ENV"
        --out-file tfvars.json

    - name: Sync secrets
      id: secrets
      if: ${{ inputs.plan_only == 'false' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
        APP_SECRETS: ${{ inputs.app-secrets }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp sync-secrets
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --keyvault-name "${{ steps.platform.outputs.keyvault }}"

    - name: First-deploy targeted apply (key vault before secrets)
      if: ${{ inputs.plan_only == 'false' && steps.secrets.outputs.vault-exists == 'false' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
        TF_IN_AUTOMATION: "true"
        IMAGE_TAGS: ${{ steps.build.outputs.image-tags || '{}' }}
        TARGETS: module.keyvault
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp terraform-deploy
        --terraform-dir "${{ github.action_path }}/../../../terraform/azure"
        --tfvars-file tfvars.json
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --tool-name "${{ steps.parse.outputs.name }}"
        --environment "$DEPLOY_ENV"
        --platform-file "${{ steps.platform.outputs.file }}"
        --image-tags "$IMAGE_TAGS"
        --targets "$TARGETS"
        --stack main

    - name: Sync secrets after vault creation
      if: ${{ inputs.plan_only == 'false' && steps.secrets.outputs.vault-exists == 'false' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
        APP_SECRETS: ${{ inputs.app-secrets }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp sync-secrets
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --keyvault-name "${{ steps.platform.outputs.keyvault }}"
        --require-vault

    # Decide whether the Terraform run happens. It always runs unless this is a
    # routine apply whose manifest did not change. Forced on for: plan-only (it
    # is a plan), always_run_terraform, manual dispatch, and first deploy (no
    # Terraform state yet). STATE_EXISTS is the authoritative first-deploy
    # signal; anything other than a definite "true" (first deploy, or an
    # undetermined/failed probe) forces the full run.
    - name: Decide apply
      id: gate
      shell: bash
      env:
        PLAN_ONLY: ${{ inputs.plan_only }}
        ALWAYS_RUN: ${{ inputs.always_run_terraform }}
        MANIFEST_CHANGED: ${{ steps.detect.outputs.manifest_changed }}
        STATE_EXISTS: ${{ steps.state.outputs.exists }}
        EVENT: ${{ github.event_name }}
      run: |
        should_apply=true
        if [ "$PLAN_ONLY" = "true" ]; then
          reason="plan-only run"
        elif [ "$ALWAYS_RUN" = "true" ]; then
          reason="always_run_terraform enabled"
        elif [ "$EVENT" = "workflow_dispatch" ]; then
          reason="manual dispatch"
        elif [ "$STATE_EXISTS" != "true" ]; then
          reason="first deploy (no Terraform state yet)"
        elif [ "$MANIFEST_CHANGED" = "true" ]; then
          reason="manifest changed"
        else
          should_apply=false
          reason="manifest unchanged — image rotation handles the new image"
        fi
        echo "should_apply=$should_apply" >> "$GITHUB_OUTPUT"
        echo "cloud-app: should_apply=$should_apply ($reason)"

    # Lane B: manifest unchanged (should_apply == false) — skip Terraform and
    # roll the freshly built image on the existing container apps / functions.
    # Reached only when state exists (never first deploy), so the resources exist.
    - name: Rotate images
      id: rotate
      if: ${{ steps.gate.outputs.should_apply == 'false' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
        IMAGE_TAGS: ${{ steps.build.outputs.image-tags || '{}' }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp rotate-images
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --environment "$DEPLOY_ENV"
        --platform-file "${{ steps.platform.outputs.file }}"
        --image-tags "$IMAGE_TAGS"
        --resource-group "${{ steps.bootstrap.outputs.resource_group }}"

    - name: Terraform deploy
      id: deploy
      if: ${{ steps.gate.outputs.should_apply == 'true' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
        TF_IN_AUTOMATION: "true"
        IMAGE_TAGS: ${{ steps.build.outputs.image-tags || '{}' }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp terraform-deploy
        --terraform-dir "${{ github.action_path }}/../../../terraform/azure"
        --tfvars-file tfvars.json
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --tool-name "${{ steps.parse.outputs.name }}"
        --environment "$DEPLOY_ENV"
        --platform-file "${{ steps.platform.outputs.file }}"
        --image-tags "$IMAGE_TAGS"
        --targets ""
        --stack main
        ${{ inputs.plan_only == 'true' && '--plan-only' || '' }}

    # Code (non-container) functions deploy their zip after apply, via the SCM
    # endpoint. Runs on the caller's runner — in production a VNet self-hosted
    # runner that can reach the private SCM endpoint. Independent of the apply
    # gate: a code change on an unchanged manifest still needs the zip pushed.
    - name: Deploy code functions
      if: ${{ inputs.plan_only == 'false' && steps.parse.outputs.code_functions == 'true' }}
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.env }}
      run: >-
        PYTHONPATH="${{ github.action_path }}/../../../engine"
        python3 -m cloudapp deploy-functions
        --terraform-dir "${{ github.action_path }}/../../../terraform/azure"
        --tool-json ".cloud-app/tool.$DEPLOY_ENV.json"
        --tool-name "${{ steps.parse.outputs.name }}"
        --environment "$DEPLOY_ENV"
        --platform-file "${{ steps.platform.outputs.file }}"

    - name: Write summary
      shell: bash
      env:
        SHOULD_APPLY: ${{ steps.gate.outputs.should_apply }}
        SUMMARY: ${{ steps.deploy.outputs.summary }}
      run: |
        if [ "$SHOULD_APPLY" = "true" ]; then
          echo "### $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### cloud-app: Terraform skipped — manifest unchanged. Rolled the new image directly on the existing container apps/functions (set always_run_terraform: true to force a full Terraform run)." >> "$GITHUB_STEP_SUMMARY"
        fi
