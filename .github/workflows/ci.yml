name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -q -r engine/requirements-dev.txt

      - name: Ruff
        working-directory: engine
        run: ruff check --config ruff.toml . ../.github/scripts

      - name: Run tests
        working-directory: engine
        run: python3 -m pytest tests/py -q --cov=cloudapp --cov-report=term-missing --cov-fail-under=90

      - name: Script tests
        run: python3 -m pytest .github/scripts/tests -q

      - name: Audit dependencies
        run: pip-audit -r engine/requirements.txt

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Format
        run: terraform -chdir=terraform/azure fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=terraform/azure init -backend=false -input=false
          terraform -chdir=terraform/azure validate

      - name: Fixtures in sync
        run: |
          python3 -m pip install --user -q -r engine/requirements.txt
          python3 engine/generate_tf_fixtures.py
          git diff --exit-code terraform/azure/tests/fixtures

      - name: Terraform tests
        run: terraform -chdir=terraform/azure test

      - name: Bootstrap stacks (fmt, validate, test)
        run: |
          for dir in terraform/azure/subscription-bootstrap terraform/azure/bootstrap; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init --chdir=terraform/azure --config="$(pwd)/.tflint.hcl"
          tflint --chdir=terraform/azure --recursive --config="$(pwd)/.tflint.hcl"
