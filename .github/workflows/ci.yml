name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -q -r engine/requirements-dev.txt

      - name: Ruff
        working-directory: engine
        run: ruff check --config ruff.toml . ../.github/scripts

      - name: Run tests
        working-directory: engine
        run: python3 -m pytest tests/py -q --cov=cloudapp --cov-report=term-missing --cov-fail-under=90

      - name: Script tests
        run: python3 -m pytest .github/scripts/tests -q

      - name: Audit dependencies
        run: pip-audit -r engine/requirements.txt

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.5"

      - name: Format
        run: terraform -chdir=terraform/azure fmt -check -recursive

      - name: Validate
        run: |
          terraform -chdir=terraform/azure init -backend=false -input=false
          terraform -chdir=terraform/azure validate

      - name: Fixtures in sync
        run: |
          python3 -m pip install --user -q -r engine/requirements.txt
          python3 engine/generate_tf_fixtures.py
          git diff --exit-code terraform/azure/tests/fixtures

      # Must run before anything that runs terraform inside terraform/azure/bootstrap
      # (e.g. "Bootstrap stacks" below) — a plan there would leave artefacts that
      # change what this drift check sees.
      - name: Bootstrap fingerprint drift
        run: |
          PYTHONPATH=engine python3 -m cloudapp bootstrap-fingerprint --root . > bootstrap.fingerprint
          git diff --exit-code bootstrap.fingerprint

      - name: Terraform tests
        run: terraform -chdir=terraform/azure test

      - name: Staged custom-module check
        run: ./terraform/azure/tests/staged-custom-check.sh

      - name: Bootstrap stacks (fmt, validate, test)
        run: |
          for dir in terraform/azure/subscription-bootstrap terraform/azure/bootstrap; do
            terraform -chdir="$dir" fmt -check -recursive
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
          done

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init --chdir=terraform/azure --config="$(pwd)/.tflint.hcl"
          tflint --chdir=terraform/azure --recursive --config="$(pwd)/.tflint.hcl"
