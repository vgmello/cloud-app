version: 2
updates:
  # Keep the SHA-pinned actions current (Dependabot bumps SHA + the # vN comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days after an Action version is released before opening a PR
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Python engine dependencies.
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    # Apply a 7-day cooldown for Python package updates
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]