name: Cloud App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev
      always_run_terraform:
        description: Force a full Terraform run (use to recover an incomplete deploy)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-app-${{ github.repository }}-${{ inputs.environment || 'dev' }}-${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
  cancel-in-progress: false

jobs:
  deploy:
    # For code (runtime) functions with a private SCM endpoint, set this to a
    # self-hosted runner inside the VNet, e.g. runs-on: [self-hosted, vnet-dev]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the default always_run_terraform: false diffs the manifest against the previous commit

      - uses: vgmello/cloud-app/.github/actions/cloud-app@main
        with:
          env: ${{ inputs.environment || 'dev' }}
          plan_only: ${{ github.event_name == 'pull_request' }}
          always_run_terraform: ${{ inputs.always_run_terraform || false }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          app-secrets: |
            STRIPE_KEY=${{ secrets.STRIPE_KEY }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
