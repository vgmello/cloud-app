name: Cloud App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-app-${{ github.repository }}-${{ inputs.environment || 'dev' }}-${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # terraform_on_manifest_change diffs the manifest against the previous commit

      - uses: vgmello/cloud-app/.github/actions/cloud-app@main
        with:
          env: ${{ inputs.environment || 'dev' }}
          plan_only: ${{ github.event_name == 'pull_request' }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Enumerate exactly the names your manifest `secrets:` list declares.
          app-secrets: |
            STRIPE_KEY=${{ secrets.STRIPE_KEY }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
