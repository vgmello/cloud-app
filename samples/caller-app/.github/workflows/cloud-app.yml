name: Cloud App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: vgmello/cloud-app/.github/workflows/cloud-app.yml@main
    secrets: inherit
    with:
      env: ${{ inputs.environment || 'dev' }}
      plan_only: ${{ github.event_name == 'pull_request' }}
