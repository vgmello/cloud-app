sonar.projectKey=cloud-app
sonar.projectName=cloud-app

sonar.sources=engine/cloudapp,.github/scripts,engine/generate_tf_fixtures.py
sonar.tests=engine/tests,.github/scripts/tests
sonar.test.inclusions=**/test_*.py,**/tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=engine/coverage.xml

# terraform, docs, plans, and generated fixtures are not part of the analysis
sonar.exclusions=terraform/**,docs/**,**/tests/fixtures/**,**/tests/golden/**
